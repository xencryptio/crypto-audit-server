version: '3.8'

services:
  crypto-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crypto-server
    ports:
      - "9000:8000"
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      # Optional: Uncomment if you want to persist data
      # - ./data:/app/data
    networks:
      - crypto-network

networks:
  crypto-network:
    driver: bridge